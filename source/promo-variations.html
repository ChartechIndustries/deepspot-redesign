<!doctype html>
<html lang="en" data-theme="dark" data-panel-color="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo banner variations</title>
<link rel="stylesheet" href="/editorial.css?v=banners11">
<link rel="stylesheet" href="/panel-colors.css?v=6">
<link rel="stylesheet" href="/promo-variations.css?v=4">
<style>
body{margin:0;padding:32px 32px 80px;background:#0b1019;color:#e8ecf2;font:14px/1.4 Arial,Helvetica,sans-serif}
h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}
h2{margin:48px 0 18px;font-size:20px;letter-spacing:-.3px;text-transform:lowercase}
.rv-note{margin:0 0 16px;color:#94a2b2}
.rv-toggle{font:13px Arial,sans-serif;color:#e8ecf2;background:#16202e;border:1px solid #34404e;padding:9px 14px;cursor:pointer}
.rv-row{display:flex;flex-wrap:wrap;gap:30px 28px;align-items:flex-start}
.rv-label{margin:0 0 8px;font-size:12px;color:#94a2b2;letter-spacing:.3px}
.rv-card .ed-promos{display:block!important;width:477px;margin:0;padding:0!important;border:0!important;background:none!important}
.rv-card .ed-promos .ed-promo{width:477px!important;height:330px!important;margin:0;border:0}
body.pv-phone .rv-card .ed-promos,body.pv-phone .rv-card .ed-promos .ed-promo{width:340px!important}
body.pv-phone .rv-competition .ed-promos .ed-promo{height:370px!important}
@media(max-width:560px){body{padding:20px 16px 60px}.rv-row{gap:24px 0}.rv-card{max-width:100%;overflow-x:auto}}
</style>
</head>
<body>
<main>
<h1>Promo banner variations</h1>
<p class="rv-note">First card in each row is the live banner. V1 to V5 are the new layouts. Cards are 477 x 330.</p>
<p class="rv-note">picks: competition current + C4 (rip on hover/click) · week current + W4 + W5 · roadmap R4 rebuild</p>
<button class="rv-toggle" id="rvPhone" aria-pressed="false">phone width: off</button>
<div id="rvRoot"></div>
</main>
<script src="/promo-variations.js?v=3"></script>
<script>
(function(){
// Live banner markup, copied from editorial.js so the first card matches the homepage.
const pins=['oyunohara','xwejni','sandchurch'];
const contours=[0,1,2,3,4,5,6,7,8].map(k=>{const r=34+k*27,pts=[];for(let i=0;i<=48;i++){const t=i/48*Math.PI*2,w=r*(1+.13*Math.sin(3*t+k*.7)+.07*Math.cos(5*t-k));pts.push((300+w*1.35*Math.cos(t)).toFixed(1)+' '+(150+w*.8*Math.sin(t)).toFixed(1))}return `<path d="M${pts.join('L')}Z"/>`}).join('');
const current={
competition:`<article class="ed-promo ed-competition"><span class="ed-dots" aria-hidden="true"></span><div class="ed-entries" aria-hidden="true">${[['teufelsberg','2'],['maishima','3'],['rummu','1']].map(([img,rank])=>`<figure class="ed-entry ed-entry-${rank}"><img src="/spots/${img}.jpg" alt="" loading="lazy" decoding="async"><b>${rank}</b></figure>`).join('')}</div><div class="ed-promo-copy"><h3><span class="ed-prize">$300</span><span class="ed-prize-line">for your curiosity.</span></h3><button data-promo="competition">the competition ↗</button></div></article>`,
week:`<article class="ed-promo ed-week"><img src="/spots/oya.jpg" alt="The immense underground halls of Oya History Museum" loading="lazy" decoding="async"><span class="ed-frame" aria-hidden="true"></span><span class="ed-place" aria-hidden="true">oya history museum · utsunomiya, japan</span><span class="ed-seal" aria-hidden="true"><svg viewBox="0 0 100 100"><defs><path id="ed-seal-ring" d="M50 50m-37 0a37 37 0 1 1 74 0a37 37 0 1 1-74 0"/></defs><text><textPath href="#ed-seal-ring" textLength="230">DEEPSPOT VERIFIED · DEEPSPOT VERIFIED · </textPath></text></svg><svg class="ed-seal-star" viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg></span><div class="ed-promo-copy"><h3>go<br><i>underground.</i></h3><button data-promo="week">spot of the week ↗</button></div></article>`,
road:`<article class="ed-promo ed-road"><svg class="ed-map" viewBox="0 0 480 270" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs>${pins.map(n=>`<pattern id="ed-pin-${n}" patternContentUnits="objectBoundingBox" width="1" height="1"><image href="/spots/${n}.jpg" width="1" height="1" preserveAspectRatio="xMidYMid slice"/></pattern>`).join('')}</defs><g class="ed-contours">${contours}</g><path class="ed-route-base" d="M-12 258C30 252 40 222 66 214S112 190 140 178S188 204 214 192S262 150 296 150"/><path class="ed-route" d="M-12 258C30 252 40 222 66 214S112 190 140 178S188 204 214 192"/><path class="ed-route-next" d="M214 192C240 180 262 150 296 150"/>${[[66,214,'oyunohara'],[140,178,'xwejni'],[214,192,'sandchurch']].map(([x,y,n])=>`<g class="ed-pin"><circle cx="${x}" cy="${y}" r="24" class="ed-pin-ring"/><circle cx="${x}" cy="${y}" r="20.5" fill="url(#ed-pin-${n})"/></g>`).join('')}<g class="ed-pin-goal"><circle cx="296" cy="150" r="22"/><circle cx="296" cy="150" r="7"/></g></svg><div class="ed-promo-copy"><h3>the way<br><i>forward.</i></h3><button data-promo="roadmap">view our roadmap ↗</button></div></article>`
};
const sections=[
['competition','competition banner','C',['podium prints','photo in type','leaderboard bars','prize ticket','rosette']],
['week','spot of the week banner','W',['split','porthole','giant type','print on cream','duotone']],
['road','roadmap banner','R',['metro line','rising steps','big arrow','summit map','route cards']],
['road4','roadmap — summit (R4 rebuild)','R4',['summit map','elevation profile','switchback trail']]
];
const V=window.DSPromoVariants,root=document.getElementById('rvRoot');
root.innerHTML=sections.map(([key,title,letter,names])=>{const r4=key==='road4',first=r4?`<div class="rv-card rv-road"><p class="rv-label">R4 · summit map (old)</p><div class="ed-promos"><article class="${V.road[3]('rvr4old').cls}">${V.road[3]('rvr4old').html}</article></div></div>`:`<div class="rv-card rv-${key}"><p class="rv-label">current</p><div class="ed-promos">${current[key]}</div></div>`;return `<section><h2>${title}</h2><div class="rv-row">${[first].concat(names.map((nm,i)=>{const code=r4?'R4'+'abc'[i]:letter+(i+1),v=V[key][i]('rv'+code.toLowerCase());return `<div class="rv-card rv-${r4?'road':key}"><p class="rv-label">${code} · ${nm}</p><div class="ed-promos"><article class="${v.cls}">${v.html}</article></div></div>`})).join('')}</div></section>`}).join('');
const btn=document.getElementById('rvPhone');
btn.onclick=()=>{const on=document.body.classList.toggle('pv-phone');btn.textContent='phone width: '+(on?'on':'off');btn.setAttribute('aria-pressed',on)};
// Banner buttons navigate on the homepage; here they do nothing.
root.addEventListener('click',e=>{if(e.target.closest('[data-promo]'))e.preventDefault()});
})();
</script>
</body>
</html>
